name: Daily sector report

# 13:00 UTC = 9:00am ET (EDT). Runs in GitHub's cloud, laptop-independent.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # so the workflow can commit the report back

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet yfinance pandas numpy

      - name: Generate daily report
        run: bash daily_report.sh

      - name: Prepare email body
        id: body
        run: |
          echo "subject=Daily Sector Report $(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          {
            echo "content<<__EOF__"
            cat results/latest.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Email report
        if: ${{ env.MAIL_USERNAME != '' }}
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Market Screener <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.body.outputs.subject }}
          convert_markdown: true
          html_body: ${{ steps.body.outputs.content }}
          attachments: results/latest.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            git push
          fi
