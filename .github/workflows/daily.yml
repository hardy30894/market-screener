name: Daily sector report

# 13:00 UTC = 9:00am ET (EDT). Runs in GitHub's cloud, laptop-independent.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # so the workflow can commit the report back

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet yfinance pandas numpy

      - name: Generate daily report
        run: bash daily_report.sh

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ docs/ || true
          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            git push
          fi
