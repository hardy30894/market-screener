name: Daily sector report

# 13:00 UTC = 9:00am ET (EDT). Runs in GitHub's cloud, laptop-independent.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # so the workflow can commit the report back

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so rebase-before-push works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet yfinance pandas numpy

      - name: Generate daily report
        run: bash daily_report.sh

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ docs/ || true
          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            # conflict-safe push: rebase onto any new origin commits (keep our fresh
            # generation on conflict), retry once. Prevents a silent push rejection.
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing (attempt $i)..."
              git pull --rebase -X theirs origin main || true
              sleep 3
            done
          fi
